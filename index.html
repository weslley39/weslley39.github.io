  <script>
    (function() {
      var s = localStorage.getItem('theme');
      if (s === 'light' || s === 'dark') { document.documentElement.dataset.theme = s; return; }
      if (window.matchMedia('(prefers-color-scheme: dark)').matches) { document.documentElement.dataset.theme = 'dark'; return; }
      if (window.matchMedia('(prefers-color-scheme: light)').matches) { document.documentElement.dataset.theme = 'light'; return; }
      var h = new Date().getHours();
      document.documentElement.dataset.theme = (h >= 6 && h < 18) ? 'light' : 'dark';
    })();
